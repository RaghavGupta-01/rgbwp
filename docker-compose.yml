services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wind-forecast-backend
    ports:
      - "8000:8000"
    environment:
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173,*
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=""
    container_name: wind-forecast-frontend
    ports:
      - "3000:80"
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
